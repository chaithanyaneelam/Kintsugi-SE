version: '3.8'

services:
  db:
    image: mariadb:10.6
    container_name: kintsugi-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "kintsugi_root_secure"
      MYSQL_DATABASE: "kintsugi_db"
      MYSQL_USER: "kintsugi"
      MYSQL_PASSWORD: "kintsugi_password"
    ports:
      - "3306:3306"
    volumes:
      - kintsugi_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kintsugi-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kintsugi-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=mysql+pymysql://kintsugi:kintsugi_password@db:3306/kintsugi_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kintsugi-celery-worker
    command: python -m celery -A app.workers.celery_worker.celery_app worker -Q kintsugi_default,ai,critical --loglevel=info
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://kintsugi:kintsugi_password@db:3306/kintsugi_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: kintsugi-web
    restart: always
    ports:
      - "8085:80"
    depends_on:
      - backend

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: kintsugi-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

volumes:
  kintsugi_db_data:
