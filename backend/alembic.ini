# A generic, single database configuration for Alembic.

[alembic]
# Path to migration script directory
script_location = alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Sys.path prepends for importing local application modules
prepend_sys_path = .

# Timezone format for migration timestamps
# timezone = UTC

# Version path separator
version_path_separator = os

# Max length of characters for generated filenames
# truncate_slug_length = 40

# Note: The database URL is purposely left empty here and is dynamically 
# injected at runtime by alembic/env.py from core/config.py settings.
sqlalchemy.url = 

[post_write_hooks]
# Post-write hooks for formatting generated migration scripts
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

[logging]
default_handler = console

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
