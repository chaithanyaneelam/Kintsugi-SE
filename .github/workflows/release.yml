name: Kintsugi Release & Production Build Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-release-artifacts:
    name: Build & Package Production Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Build Web Production Bundle
      - name: Build Web Application Bundle
        run: |
          cd web
          npm ci
          npm run build

      # Build Android Release APK
      - name: Setup Gradle & Build Android APK
        uses: gradle/actions/setup-gradle@v3
      - name: Assemble Android Debug APK
        run: |
          cd frontend
          chmod +x gradlew
          ./gradlew assembleDebug

      # Create GitHub Release
      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: false
          files: |
            frontend/app/build/outputs/apk/debug/app-debug.apk
            Kintsugi_Master_Test_Cases_300.xlsx
            CHANGELOG.md
            RELEASE.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
