<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Background Squircle Gradient (ChatGPT / Apple App Icon style) -->
    <linearGradient id="fav-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Kintsugi Gold Fill Gradient -->
    <linearGradient id="fav-gold" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#F4C542" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Edge-to-Edge Container Squircle (Matching ChatGPT Favicon Container) -->
  <rect width="100" height="100" rx="26" fill="url(#fav-bg)" />
  <rect width="94" height="94" x="3" y="3" rx="23" stroke="#A855F7" stroke-width="1.5" opacity="0.6" />

  <!-- Outer Organic AI Spark -->
  <path d="M 50,12 C 50,32 32,50 12,50 C 32,50 50,68 50,88 C 50,68 68,50 88,50 C 68,50 50,32 50,12 Z" fill="#FAFAFA" opacity="0.95" />

  <!-- Center Golden Kintsugi Core Spark -->
  <path d="M 50,24 C 50,38 38,50 24,50 C 38,50 50,62 50,76 C 50,62 62,50 76,50 C 62,50 50,38 50,24 Z" fill="url(#fav-gold)" filter="url(#fav-glow)" />

  <!-- Inner Bright Core Point -->
  <circle cx="50" cy="50" r="5" fill="#FAFAFA" />
</svg>